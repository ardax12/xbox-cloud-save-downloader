[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xbox-save-harvest"
version = "0.1.0"
description = "Read-only Xbox Connected Storage cloud save downloader for Windows"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
build = [
    "pyinstaller>=6.10.0",
]

[project.scripts]
xbox-save-harvest = "xbox_save_harvest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
